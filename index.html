<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>Kana Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181C">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Bundled font: renders every character identically on every device,
     rather than depending on whichever Japanese font (if any) happens to
     be installed. M PLUS 1p was chosen for clean, modern legibility with
     no Adobe/Reserved-Font-Name entanglement in its license (plain
     OFL, Copyright The M+ Project Authors). Subsetted to hiragana +
     katakana + every kanji character actually used across the app's
     kanji rows (118 characters) + 仮, so it's still only ~23KB per
     weight instead of the multi-MB original. IMPORTANT: adding new
     kanji to KANJI_ROWS requires re-subsetting this font to include
     the new codepoints, or those characters will silently fall back
     to whatever the device happens to have installed — the exact
     inconsistency this bundled font exists to prevent. Its 500 (Medium)
     weight is registered under the CSS weight 600, since M PLUS 1p has
     no dedicated 600/SemiBold cut. */
  @font-face{
    font-family:"KanaTrainer JP";
    src:url("fonts/MPLUS1p-Full-Regular.woff2") format("woff2");
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:"KanaTrainer JP";
    src:url("fonts/MPLUS1p-Full-Medium.woff2") format("woff2");
    font-weight:600;
    font-display:swap;
  }
  :root{
    /* dark ("yozora" / night-sky) is the default theme */
    --paper:#14181C;
    --paper-line:#2B333A;
    --ink:#E9E4D8;
    --ink-soft:#9B988C;
    --indigo:#7FA6C2;
    --indigo-deep:#9DBEDA;
    --hanko:#E08370;
    --moss:#8FBA8E;
    --card:#1B2126;
    --radius-sm:8px;
    --radius:12px;
    --radius-lg:18px;
    --radius-pill:999px;
  }
  [data-theme="light"]{
    --paper:#EFE9DA;
    --paper-line:#D5CBAF;
    --ink:#26241F;
    --ink-soft:#5B564A;
    --indigo:#33526B;
    --indigo-deep:#1F3A4D;
    --hanko:#A83F32;
    --moss:#5C7A5E;
    --card:#F7F3E8;
  }
  body{ transition:background 0.15s, color 0.15s; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .jp{ font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","MS Gothic",sans-serif; }

  header{
    width:100%;
    max-width:680px;
    padding:16px 20px 14px;
    border-bottom:1px solid var(--paper-line);
    position:relative;
  }
  header .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  h1{
    font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:0.02em;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  h1 .kana-mark{ color:var(--indigo); }
  .mode-switcher{ position:relative; flex-shrink:0; }
  .mode-pill{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    background:var(--card);
    border:1px solid var(--paper-line);
    color:var(--ink);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  border-radius:var(--radius-pill);}
  .mode-pill:hover{ border-color:var(--indigo); }
  .mode-pill .mode-caret{
    font-size:12px;
    color:var(--ink-soft);
    transition:transform 0.15s;
    display:inline-block;
  }
  .mode-pill[aria-expanded="true"] .mode-caret{ transform:rotate(180deg); }
  .mode-panel{
    left:0; right:auto;
    min-width:170px;
  }
  .sub-menu button.active{ color:var(--ink); font-weight:700; }
  .sub-menu button:disabled{ opacity:0.4; cursor:not-allowed; }
  .tagline{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .menu-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--paper-line);
    color:var(--ink);
    font-size:18px;
    line-height:1;
    padding:8px 12px;
    cursor:pointer;
  border-radius:var(--radius-sm);}
  .menu-panel{
    position:absolute;
    top:100%;
    right:20px;
    margin-top:6px;
    display:flex;
    flex-direction:column;
    background:var(--card);
    border:1px solid var(--paper-line);
    min-width:210px;
    z-index:20;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  border-radius:var(--radius);overflow:hidden;}
  .menu-panel[hidden]{ display:none; }
  .menu-panel button{
    padding:16px 20px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--paper-line);
    color:var(--ink-soft);
    font-size:17px;
    text-align:left;
    cursor:pointer;
  }
  .menu-panel button:last-child{ border-bottom:none; }
  .menu-panel button.active{ color:var(--ink); font-weight:600; }
  .menu-panel button:hover{ background:var(--paper); }
  .theme-toggle{
    background:transparent;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    font-size:12.5px;
    padding:6px 12px;
    cursor:pointer;
    flex-shrink:0;
  }
  .theme-toggle:hover{ color:var(--ink); border-color:var(--indigo); }

  main{
    width:100%;
    max-width:680px;
    padding:26px 20px 60px;
    flex:1;
  }

  /* ---------- Home / Study intro ---------- */
  .summary-row{
    display:flex;
    gap:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .stat-block{
    flex:1;
    min-width:120px;
    background:var(--card);
    border:1px solid var(--paper-line);
    padding:14px 16px;
  border-radius:var(--radius);}
  .stat-block .num{
    font-size:26px;
    font-weight:600;
    font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    line-height:1;
  }
  .stat-block .lab{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .start-btn{
    width:100%;
    padding:16px;
    background:var(--indigo);
    color:#F7F3E8;
    border:none;
    font-size:16px;
    cursor:pointer;
    letter-spacing:0.01em;
  border-radius:var(--radius);}
  .start-btn:hover{ background:var(--indigo-deep); }
  .start-btn:disabled{ background:var(--paper-line); color:var(--ink-soft); cursor:default; }
  .free-study-wrap{ position:relative; margin-top:10px; }
  .muted-btn{
    width:100%;
    padding:11px;
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--paper-line);
    font-size:13.5px;
    cursor:pointer;
  border-radius:var(--radius);}
  .muted-btn:hover{ color:var(--ink); border-color:var(--indigo); }
  .sub-menu{
    position:absolute;
    top:100%;
    left:0; right:0;
    margin-top:6px;
    display:flex;
    flex-direction:column;
    background:var(--card);
    border:1px solid var(--paper-line);
    z-index:15;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    max-height:260px;
    overflow-y:auto;
  border-radius:var(--radius);overflow:hidden;}
  .sub-menu[hidden]{ display:none; }
  .sub-menu button{
    padding:16px 18px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--paper-line);
    color:var(--ink);
    font-size:16px;
    text-align:left;
    cursor:pointer;
  }
  .sub-menu button:last-child{ border-bottom:none; }
  .sub-menu button:hover{ background:var(--paper); }
  p.help{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; }

  .row-progress{ margin-top:26px; }
  .row-progress h3{ font-size:14px; font-weight:600; margin:0 0 10px; color:var(--ink-soft); }
  h3.settings-section{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--indigo);
    margin:32px 0 14px;
    padding-top:20px;
    border-top:1px solid var(--paper-line);
  }
  h3.settings-section:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .row-line{
    display:flex; align-items:center; gap:10px;
    padding:6px 0; border-bottom:1px solid var(--paper-line);
    font-size:14px;
  }
  .row-line .rk{ font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; font-size:17px; width:140px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-line .rk.label{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:13px; }
  .row-line .bar{ flex:1; height:6px; background:var(--paper-line); position:relative; border-radius:var(--radius-pill);overflow:hidden;}
  .row-line .bar .fill{ position:absolute; left:0; top:0; bottom:0; background:var(--moss); }
  .row-line .locked{ color:var(--paper-line); }
  .row-line .pct{ width:38px; text-align:right; color:var(--ink-soft); font-size:12px;}

  /* ---------- Card / Study view ---------- */
  .session-bar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--ink-soft); margin-bottom:14px;
  }
  .session-bar .track{ flex:1; height:4px; background:var(--paper-line); margin:0 12px; position:relative;}
  .session-bar .track .fill{ position:absolute; left:0;top:0;bottom:0; background:var(--indigo);}

  .card{
    background:var(--card);
    border:1px solid var(--ink);
    padding:0;
    position:relative;
  border-radius:var(--radius-lg);overflow:hidden;}
  .card::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid var(--paper-line);
    border-radius:calc(var(--radius-lg) - 6px);
    pointer-events:none;
  }
  .card-inner{ padding:40px 24px; text-align:center; }
  .prompt-label{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .prompt-kana{
    font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    font-size:88px; line-height:1;
    color:var(--ink);
  }
  .prompt-romaji{
    font-size:44px; font-weight:600; letter-spacing:0.03em;
    color:var(--ink);
  }

  .answer-area{ margin-top:26px; }
  .romaji-input{
    width:100%; max-width:280px;
    font-size:22px;
    padding:12px 14px;
    border:1px solid var(--ink-soft);
    background:var(--card);
    color:var(--ink);
    text-align:center;
    outline:none;
  border-radius:var(--radius-sm);}
  .romaji-input:focus{ border-color:var(--indigo); }
  .submit-row{ margin-top:14px; }
  .submit-btn{
    padding:10px 26px; font-size:15px;
    background:var(--indigo); color:#F7F3E8; border:none; cursor:pointer;
  border-radius:var(--radius);}
  .submit-btn:disabled{ background:var(--paper-line); color:var(--ink-soft); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(52px,1fr));
    gap:8px;
    margin-top:8px;
  }
  .grid button{
    font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    font-size:22px;
    padding:10px 0;
    background:var(--card);
    border:1px solid var(--paper-line);
    cursor:pointer;
    color:var(--ink);
  border-radius:var(--radius-sm);}
  .grid button:hover{ border-color:var(--indigo); }
  .grid button.correct{ background:var(--moss); color:#fff; border-color:var(--moss); }
  .grid button.incorrect{ background:var(--hanko); color:#fff; border-color:var(--hanko); }
  .grid button.reveal{ outline:2px solid var(--moss); }
  .grid button:disabled{ cursor:default; opacity:0.55; }
  .grid button:disabled.correct,.grid button:disabled.incorrect,.grid button:disabled.reveal{ opacity:1; }

  .draw-wrap{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin-top:8px;
  }
  canvas.draw-canvas{
    background:var(--card);
    border:1px solid var(--ink-soft);
    touch-action:none;
    cursor:crosshair;
    width:220px; height:220px;
  border-radius:var(--radius-sm);}
  .draw-tools{ display:flex; gap:8px; }
  .draw-tools button{
    padding:8px 14px; font-size:13px; border:1px solid var(--paper-line);
    background:transparent; color:var(--ink-soft); cursor:pointer;
  border-radius:var(--radius-sm);}
  .draw-tools button:hover{ color:var(--ink); border-color:var(--indigo); }
  .reveal-compare{
    display:flex; align-items:center; justify-content:center;
    margin-top:6px;
  }
  .reveal-compare .answer-kana{
    font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    font-size:60px; color:var(--ink);
  }
  .self-grade{ display:flex; gap:10px; justify-content:center; margin-top:16px; }
  .self-grade button{
    padding:12px 22px; font-size:14px; border:none; cursor:pointer; color:#fff;
  border-radius:var(--radius);}
  .self-grade .yes{ background:var(--moss); }
  .self-grade .no{ background:var(--hanko); }

  .ref-section{ margin-top:22px; }
  .ref-section:first-child{ margin-top:0; }
  .ref-section h3{ font-size:14px; font-weight:600; margin:0 0 10px; color:var(--ink-soft); }
  .ref-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
    gap:8px;
  }
  .ref-cell{
    background:var(--card);
    border:1px solid var(--paper-line);
    padding:10px 4px 8px;
    text-align:center;
    cursor:pointer;
    font:inherit;
    width:100%;
  border-radius:var(--radius-sm);}
  .ref-cell:hover{ border-color:var(--indigo); }
  .ref-cell.active{ border-color:var(--indigo); background:var(--paper); }
  .ref-cell .k{
    font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    font-size:22px;
    color:var(--ink);
  }
  .ref-cell .r{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .ref-detail{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:18px;
    min-height:26px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .ref-detail-kana{ font-size:36px; color:var(--ink); flex-shrink:0; }
  .ref-detail-body{ flex:1; }
  .ref-detail-primary{ font-size:18px; font-weight:600; color:var(--ink); }
  .ref-detail-alts{ font-size:18px; font-weight:400; color:var(--ink-soft); }

  .feedback{
    margin-top:18px; min-height:26px; font-size:15px; font-weight:600;
  }
  .feedback.good{ color:var(--moss); }
  .feedback.bad{ color:var(--hanko); }

  .next-btn{
    margin-top:16px;
    padding:10px 26px; font-size:15px;
    background:var(--ink); color:var(--card); border:none; cursor:pointer;
  border-radius:var(--radius);}

  .session-end{ text-align:center; padding:40px 10px; }
  .session-end .num{ font-size:48px; font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; }

  /* ---------- Stats ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--paper-line); }
  th{ color:var(--ink-soft); font-weight:600; font-size:12px; }
  td.kn{ font-family:"KanaTrainer JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; font-size:17px; }
  .tag{ font-size:11px; padding:2px 6px; border:1px solid var(--paper-line); }
  .tag.rev{ color:var(--moss); border-color:var(--moss); }
  .tag.lrn{ color:var(--indigo); border-color:var(--indigo); }
  .tag.new{ color:var(--ink-soft); }

  /* ---------- Settings ---------- */
  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=number]{ width:90px; padding:7px 9px; border:1px solid var(--paper-line); font-size:15px; background:var(--card); color:var(--ink); border-radius:var(--radius-sm);}
  .field .choice-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .field .choice-row button{
    padding:8px 14px; font-size:13px; border:1px solid var(--paper-line);
    background:var(--card); color:var(--ink); cursor:pointer;
  border-radius:var(--radius-sm);}
  .field .choice-row button.active{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
  .choice-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .choice-row button{
    padding:8px 14px; font-size:13px; border:1px solid var(--paper-line);
    background:var(--card); color:var(--ink); cursor:pointer;
  border-radius:var(--radius-sm);}
  .choice-row button.active{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
  .choice-row button:disabled{ opacity:0.4; cursor:not-allowed; }
  .script-switch{ margin-bottom:18px; }
  .script-switch button{ flex:1; text-align:center; }
  .io-row{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .io-row button{ padding:10px 16px; font-size:13.5px; border:1px solid var(--ink); background:var(--card); color:var(--ink); cursor:pointer; border-radius:var(--radius-sm);}
  .io-row button.primary{ background:var(--ink); color:var(--card); }
  .warn-box{
    background:var(--card); border:1px solid var(--hanko); color:var(--hanko);
    padding:10px 14px; font-size:13px; margin-top:14px;
  }
  .note-box{
    background:var(--card); border:1px solid var(--paper-line);
    padding:10px 14px; font-size:12.5px; color:var(--ink-soft); margin-top:14px; line-height:1.6;
  }
  #importFile{ display:none; }

  @media (prefers-reduced-motion:no-preference){
    .card{ animation:settle 0.18s ease-out; }
  }
  @keyframes settle{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  button:focus-visible, input:focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1><span class="jp kana-mark">仮</span> Kana Trainer</h1>
    <div class="mode-switcher">
      <button class="mode-pill" id="modePillBtn" aria-haspopup="true" aria-expanded="false">
        <span id="modePillLabel">Hiragana</span><span class="mode-caret">⌄</span>
      </button>
      <div class="sub-menu mode-panel" id="modePanel" hidden>
        <button data-script="hiragana">Hiragana</button>
        <button data-script="katakana">Katakana</button>
        <button data-script="kanji">Kanji</button>
        <button data-script="mixed">Mixed</button>
      </div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
  </div>
  <div class="menu-panel" id="menuPanel" hidden>
    <button data-route="home">Study</button>
    <button data-route="reference">Answer key</button>
    <button data-route="settings">Settings</button>
  </div>
</header>

<main id="main"></main>

<input type="file" id="importFile" accept="application/json">

<script>
(function(){
"use strict";

/* ============================= SCRIPT DATA ============================= */
/* Each script (hiragana, katakana, ...future kanji) owns its own row list,
   its own progressive unlock gate, and its own daily new-character budget.
   Mastering one script never affects another's pacing — "lessons always
   separated" is enforced structurally here, not just in the UI. */

const HIRAGANA_ROWS = [
  {id:'vowels', label:'あ行 vowels', items:[['あ','a'],['い','i'],['う','u'],['え','e'],['お','o']]},
  {id:'k', label:'か行 k-row', items:[['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko']]},
  {id:'s', label:'さ行 s-row', items:[['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so']]},
  {id:'t', label:'た行 t-row', items:[['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to']]},
  {id:'n', label:'な行 n-row', items:[['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no']]},
  {id:'h', label:'は行 h-row', items:[['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho']]},
  {id:'m', label:'ま行 m-row', items:[['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo']]},

/* Kanji reuses the exact same card/scheduling engine as kana — each row
   entry is a [character(s), reading] pair just like a youon combo can be
   multi-character. The one deliberate difference is the default answer
   method (see DEFAULT_SETTINGS): kanji defaults to tap-grid rather than
   freehand drawing, since correctly hand-drawing a kanji from memory is a
   meaningfully harder skill than tracing a kana glyph — freehand is still
   available as an opt-in per-script setting for anyone who wants it. */
const SCRIPT_DEFS = {
  hiragana: { id:'hiragana', label:'Hiragana', enabled:true, hasYouon:true, rows:HIRAGANA_ROWS },
  katakana: { id:'katakana', label:'Katakana', enabled:true, hasYouon:true, rows:KATAKANA_ROWS },
  kanji:    { id:'kanji',    label:'Kanji',    enabled:true, hasYouon:false, rows:KANJI_ROWS }
};
const SCRIPT_ORDER = ['hiragana','katakana','kanji'];
const ENABLED_SCRIPTS = SCRIPT_ORDER.filter(id=>SCRIPT_DEFS[id].enabled);

/* Every character across every enabled script, flattened, each tagged
   with which script it belongs to. Kana text itself is unique per script
   (か and カ are different Unicode characters), so card keys never collide
   across scripts even without an explicit script prefix — but cards still
   carry .script explicitly for filtering. */
const ALL_KANA_LIST = [];
ENABLED_SCRIPTS.forEach(scriptId=>{
  const def = SCRIPT_DEFS[scriptId];
  def.rows.forEach((row, ri)=>{
    row.items.forEach(([kana, romaji, meaning])=>{
      ALL_KANA_LIST.push({ kana, romaji, meaning, script:scriptId, rowId:row.id, rowIndex:ri, rowLabel:row.label, optional:!!row.optional, toggleKey:row.toggleKey });
    });
  });
});
function kanaListForScript(scriptId){ return ALL_KANA_LIST.filter(k=>k.script===scriptId); }

/* Whether an optional row (or an item copied from one) is currently
   switched on. Generalizes the old hardcoded "youon toggle" so any
   script can register its own optional row behind its own setting —
   kanji's Travel & Signage row uses includeTravelKanji, hiragana's youon
   row uses includeYouonHiragana, katakana's uses includeYouonKatakana —
   all fully independent. Non-optional rows are always on. */
function isRowEnabled(rowOrItem){
  if(!rowOrItem.optional) return true;
  return !!(rowOrItem.toggleKey && state.settings[rowOrItem.toggleKey]);
}

/* Kunrei/Nihon-shiki alternates that are genuinely ambiguous with another
   character's Hepburn reading get scoped to the specific kana rather than
   the romaji string, since じ/ぢ (and their katakana equivalents ジ/ヂ)
   share a Hepburn romaji (ji) but do NOT share the same Kunrei-shiki
   alternate (じ/ジ=zi, ぢ/ヂ=di). Applying these as a blanket romaji-level
   pair would incorrectly accept "di" for じ or "du" for ず. */
const KANA_SPECIFIC_ALTS = {
  'じ':['zi'], 'ぢ':['di'], 'づ':['du'],
  'ジ':['zi'], 'ヂ':['di'], 'ヅ':['du']
};

function altSpellings(r, kana){
  const pairs = [['shi','si'],['chi','ti'],['tsu','tu'],['fu','hu'],
    ['sha','sya'],['shu','syu'],['sho','syo'],['cha','tya'],['chu','tyu'],['cho','tyo'],
    ['ja','zya'],['ju','zyu'],['jo','zyo']];
  const set = new Set([r]);
  pairs.forEach(([a,b])=>{ if(r===a) set.add(b); if(r===b) set.add(a); });
  if(r==='n') set.add('nn');
  if(r==='wo') set.add('o');
  if(kana && KANA_SPECIFIC_ALTS[kana]) KANA_SPECIFIC_ALTS[kana].forEach(a=>set.add(a));
  return [...set];
}

/* Kanji meanings are stored as a single string with "/" separating
   genuinely common alternate senses (e.g. "front/before" for 前) —
   split here so typing any one of them is accepted. */
function acceptedMeanings(meaning){
  if(!meaning) return [];
  return meaning.split('/').map(s=>s.trim().toLowerCase()).filter(Boolean);
}

/* ============================= SETTINGS ============================= */
const DEFAULT_SETTINGS = {
  newPerDay: { hiragana:5, katakana:5, kanji:3 },      // per script — kanji defaults slower given the heavier cognitive load
  reviewCap: { hiragana:40, katakana:40, kanji:30 },   // per script
  kanaInputMode: { hiragana:'draw', katakana:'draw', kanji:'select' }, // per script: 'draw' (freehand, self-graded) | 'select' (tap grid)
  includeYouonHiragana: false, // hiragana's optional youon row
  includeYouonKatakana: false, // katakana's optional youon row
  includeTravelKanji: false,  // gates kanji's optional Travel & Signage row
  directionMode: 'both',      // 'both' | 'recognition' | 'production' — shared across scripts
  gridScope: 'unlocked',      // 'unlocked' (only unlocked rows) | 'all' (every character in that script) — shared
  theme: 'dark',              // 'dark' | 'light'
  studyScript: 'hiragana'     // 'hiragana' | 'katakana' | 'kanji' | 'mixed'
};

/* ---------- Theme ---------- */
function applyTheme(){
  const t = state.settings.theme;
  document.documentElement.dataset.theme = (t === 'light') ? 'light' : '';
}

/* ============================= STATE ============================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* Object.assign({}, DEFAULT_SETTINGS) is only a SHALLOW copy — the nested
   per-script objects (newPerDay, reviewCap, kanaInputMode) would still be
   the exact same object references as DEFAULT_SETTINGS itself, so any
   later mutation (e.g. changing kanji's daily budget in Settings) would
   silently corrupt the actual defaults for every future reset. */
function cloneDefaultSettings(){
  return Object.assign({}, DEFAULT_SETTINGS, {
    newPerDay: Object.assign({}, DEFAULT_SETTINGS.newPerDay),
    reviewCap: Object.assign({}, DEFAULT_SETTINGS.reviewCap),
    kanaInputMode: Object.assign({}, DEFAULT_SETTINGS.kanaInputMode)
  });
}

function freshState(){
  return {
    settings: cloneDefaultSettings(),
    cards: {},               // key: "kana|direction" -> card record (each tagged with .script)
    newIntroducedToday: { hiragana:0, katakana:0, kanji:0 },
    lastActiveDate: todayStr(),
    totals: { reviews:0, correct:0 },
    rowOverrides: { hiragana:{}, katakana:{}, kanji:{} },  // per script: rowId -> 'unlock' | 'lock'
    createdAt: Date.now()
  };
}

let state = freshState();

/* One shared migration path for both the autosave-load and file-import
   routes, so old saved progress (from before katakana existed) upgrades
   consistently instead of each load path handling it slightly differently
   — that kind of divergence is exactly what caused bugs before. */
function migrateState(raw){
  if(!raw || typeof raw !== 'object') return freshState();

  const origSettings = raw.settings || {};
  raw.settings = Object.assign({}, DEFAULT_SETTINGS, origSettings);

  /* includeYouon used to be one shared toggle for both hiragana and
     katakana; now each script has its own. Old saves carry the single
     boolean — apply it to both new keys so existing behavior is preserved
     exactly (nothing suddenly turns off), while future changes are
     independent. */
  if('includeYouon' in origSettings && !('includeYouonHiragana' in origSettings) && !('includeYouonKatakana' in origSettings)){
    raw.settings.includeYouonHiragana = !!origSettings.includeYouon;
    raw.settings.includeYouonKatakana = !!origSettings.includeYouon;
  }

  /* newPerDay, reviewCap, kanaInputMode all moved from a single shared
     value to a per-script object (so e.g. kanji can default to a slower
     pace / grid-select without dragging hiragana/katakana along with it).
     Old saves have a bare number/string here — apply that old value to
     hiragana+katakana (preserving prior behavior exactly) and let the
     newly-introduced kanji entry take the fresh default, since kanji
     didn't exist when that value was set. */
  function migratePerScript(oldVal, defaults, kind){
    if(typeof oldVal === kind){
      return { hiragana: oldVal, katakana: oldVal, kanji: defaults.kanji };
    }
    if(!oldVal || typeof oldVal !== 'object'){
      return Object.assign({}, defaults);
    }
    return Object.assign({}, defaults, oldVal);
  }
  raw.settings.newPerDay = migratePerScript(origSettings.newPerDay, DEFAULT_SETTINGS.newPerDay, 'number');
  raw.settings.reviewCap = migratePerScript(origSettings.reviewCap, DEFAULT_SETTINGS.reviewCap, 'number');
  raw.settings.kanaInputMode = migratePerScript(origSettings.kanaInputMode, DEFAULT_SETTINGS.kanaInputMode, 'string');

  if(!raw.rowOverrides){
    raw.rowOverrides = { hiragana:{}, katakana:{}, kanji:{} };
  } else if(!('hiragana' in raw.rowOverrides) && !('katakana' in raw.rowOverrides)){
    /* Old flat shape from before multi-script support: {rowId:'lock'/'unlock'},
       implicitly all-hiragana since that was the only script that existed. */
    raw.rowOverrides = { hiragana: raw.rowOverrides, katakana:{}, kanji:{} };
  } else {
    if(!raw.rowOverrides.hiragana) raw.rowOverrides.hiragana = {};
    if(!raw.rowOverrides.katakana) raw.rowOverrides.katakana = {};
    if(!raw.rowOverrides.kanji) raw.rowOverrides.kanji = {};
  }

  if(Array.isArray(raw.forcedRows)){
    /* Even older deprecated shape, predating the lock/unlock toggle itself. */
    raw.forcedRows.forEach(id => { if(!(id in raw.rowOverrides.hiragana)) raw.rowOverrides.hiragana[id] = 'unlock'; });
    delete raw.forcedRows;
  }

  if(typeof raw.newIntroducedToday === 'number'){
    raw.newIntroducedToday = { hiragana: raw.newIntroducedToday, katakana: 0, kanji: 0 };
  } else if(!raw.newIntroducedToday){
    raw.newIntroducedToday = { hiragana:0, katakana:0, kanji:0 };
  } else {
    if(typeof raw.newIntroducedToday.hiragana !== 'number') raw.newIntroducedToday.hiragana = 0;
    if(typeof raw.newIntroducedToday.katakana !== 'number') raw.newIntroducedToday.katakana = 0;
    if(typeof raw.newIntroducedToday.kanji !== 'number') raw.newIntroducedToday.kanji = 0;
  }

  if(!raw.cards) raw.cards = {};
  Object.values(raw.cards).forEach(c=>{
    if(!c.script) c.script = 'hiragana'; // every card predating katakana was hiragana
  });

  if(!raw.totals) raw.totals = { reviews:0, correct:0 };
  if(!raw.lastActiveDate) raw.lastActiveDate = todayStr();
  if(!raw.createdAt) raw.createdAt = Date.now();

  return raw;
}

/* ---------- Autosave (localStorage) ---------- */
const STORAGE_KEY = 'kanaTrainerState';

function persistState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(err){
    /* storage unavailable/full — manual export still works as a fallback */
  }
}

function loadPersistedState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.cards && parsed.settings) return migrateState(parsed);
  }catch(err){ /* ignore, fall back to fresh state */ }
  return null;
}

function cardKey(kana, direction){ return kana + '|' + direction; }

function ensureCard(item, direction){
  const key = cardKey(item.kana, direction);
  if(!state.cards[key]){
    state.cards[key] = {
      kana:item.kana, romaji:item.romaji, meaning:item.meaning, script:item.script, rowId:item.rowId, rowIndex:item.rowIndex,
      direction,
      phase:'new',        // new -> learning -> review (or relearning)
      interval:0,          // days, once in review
      ease:2.5,
      reps:0,
      lapses:0,
      dueDate:null,        // for review-phase cards, ms epoch
      reviewsCount:0,
      correctCount:0,
      lastLatency:null
    };
  }
  return state.cards[key];
}

/* Reset each script's daily new-card counter if the date has rolled over */
function rolloverDay(){
  const t = todayStr();
  if(state.lastActiveDate !== t){
    state.lastActiveDate = t;
    ENABLED_SCRIPTS.forEach(s=> state.newIntroducedToday[s] = 0);
  }
}

/* Which rows are unlocked in a given script: a row unlocks once every card
   (both directions, respecting current direction mode) in all previously-
   unlocked rows of THAT SCRIPT has graduated into 'review' at least once.
   Purely mastery-based, unaffected by manual overrides, so progress-based
   unlocking keeps working even if a row is toggled off for a while. */
function naturallyUnlockedRowIds(scriptId){
  const def = SCRIPT_DEFS[scriptId];
  const activeRows = def.rows.filter(isRowEnabled);
  const directions = directionsForMode();
  const items = kanaListForScript(scriptId);

  const natural = new Set();
  let sequentialOpen = true;
  for(let i=0;i<activeRows.length;i++){
    const row = activeRows[i];
    if(!sequentialOpen) continue;
    natural.add(row.id);
    const rowItems = items.filter(k => k.rowId === row.id);
    const allGraduated = rowItems.every(item =>
      directions.every(dir => {
        const c = state.cards[cardKey(item.kana, dir)];
        return c && c.phase === 'review';
      })
    );
    if(!allGraduated) sequentialOpen = false;
  }
  return natural;
}

function unlockedRowIndexes(scriptId){
  const def = SCRIPT_DEFS[scriptId];
  const activeRows = def.rows.filter(isRowEnabled);
  const natural = naturallyUnlockedRowIds(scriptId);
  const overrides = (state.rowOverrides && state.rowOverrides[scriptId]) || {};

  const unlocked = new Set();
  activeRows.forEach(row=>{
    const override = overrides[row.id];
    if(override === 'unlock') unlocked.add(row.id);
    else if(override === 'lock') { /* stays out */ }
    else if(natural.has(row.id)) unlocked.add(row.id);
  });
  return unlocked;
}

function directionsForMode(){
  if(state.settings.directionMode === 'recognition') return ['recognition'];
  if(state.settings.directionMode === 'production') return ['production'];
  return ['recognition','production'];
}

function activeKanaList(scriptId){
  const unlocked = unlockedRowIndexes(scriptId);
  return kanaListForScript(scriptId).filter(k => isRowEnabled(k) && unlocked.has(k.rowId));
}

/* じ/ぢ (and katakana ジ/ヂ) share an identical Hepburn reading — genuinely
   ambiguous when only the romaji is shown. Scoped to same-script matches
   only: か and カ sharing "ka" is just the normal hiragana/katakana
   relationship, not a genuine ambiguity worth flagging. */
/* じ/ぢ (and katakana ジ/ヂ) share an identical Hepburn reading — genuinely
   ambiguous when only the romaji is shown, since they're just two spellings
   of the same sound. Kanji reading collisions are a different situation
   entirely: 五/午/語 all read "go" but are completely unrelated characters
   (five / noon / language) that just happen to sound alike — treating them
   as interchangeable would mark genuinely wrong answers as correct, so
   this only ever applies to kana scripts. */
function homophonesOf(kana){
  const item = ALL_KANA_LIST.find(k=>k.kana===kana);
  if(!item || item.script === 'kanji') return [];
  return ALL_KANA_LIST.filter(k=>k.script===item.script && k.romaji===item.romaji && k.kana!==kana).map(k=>k.kana);
}

/* Tap-grid decoys always come from the tested character's own script,
   regardless of whether the session itself is single-script or mixed —
   offering katakana decoys for a hiragana question would add a confusing
   axis of difficulty nobody asked for. */
function gridPool(card){
  const scriptId = card.script;
  if(state.settings.gridScope === 'all'){
    return kanaListForScript(scriptId).filter(isRowEnabled);
  }
  return activeKanaList(scriptId);
}

function isForceUnlocked(scriptId, rowId){
  return !!(state.rowOverrides && state.rowOverrides[scriptId] && state.rowOverrides[scriptId][rowId] === 'unlock');
}

/* ============================= SCHEDULING ============================= */
const LEARN_LAG = [3,7];      // reinsert 3-7 cards later, same session
const RELEARN_LAG = [2,4];
const LEARN_STEPS_REQUIRED = 2; // correct answers needed to graduate

function graded(card, correct, latencyMs){
  state.totals.reviews++;
  card.reviewsCount++;
  card.lastLatency = latencyMs;
  if(correct){ state.totals.correct++; card.correctCount++; }

  if(card.phase === 'new'){
    card.phase = 'learning';
    card.learnProgress = 0;
  }

  if(card.phase === 'learning' || card.phase === 'relearning'){
    if(correct){
      card.learnProgress = (card.learnProgress||0) + 1;
      if(card.learnProgress >= LEARN_STEPS_REQUIRED){
        card.phase = 'review';
        card.reps = 1;
        card.interval = 1;
        card.ease = card.ease || 2.5;
        card.dueDate = Date.now() + 86400000;
        return { requeue:false };
      }
      return { requeue:true, lag: randBetween(LEARN_LAG[0], LEARN_LAG[1]) };
    } else {
      card.learnProgress = 0;
      return { requeue:true, lag: randBetween(RELEARN_LAG[0], RELEARN_LAG[1]) };
    }
  }

  if(card.phase === 'review'){
    if(correct){
      const wideGrid = (card.direction === 'recognition' && state.settings.kanaInputMode[card.script] === 'select' && state.settings.gridScope === 'all');
      const q = wideGrid ? 4 : (latencyMs < 3000 ? 5 : (latencyMs < 7000 ? 4 : 3));
      card.reps++;
      if(card.reps === 1) card.interval = 1;
      else if(card.reps === 2) card.interval = 6;
      else card.interval = Math.round(card.interval * card.ease);
      card.ease = Math.max(1.3, card.ease + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
      card.dueDate = Date.now() + card.interval*86400000;
      return { requeue:false };
    } else {
      card.lapses++;
      card.phase = 'relearning';
      card.learnProgress = 0;
      card.interval = Math.max(1, Math.round(card.interval*0.5));
      return { requeue:true, lag: randBetween(RELEARN_LAG[0], RELEARN_LAG[1]) };
    }
  }
  return { requeue:false };
}

function randBetween(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

/* ============================= SESSION ============================= */
let session = null; // { queue:[card,...], pos, correctCount, total, ... }

function scriptsForMode(scriptMode){
  return scriptMode === 'mixed' ? ENABLED_SCRIPTS.slice() : [scriptMode];
}

/* Mixed mode deliberately never introduces new characters — only reviews
   what's already unlocked across both scripts. New-character introduction
   always happens inside a specific script's own mode, so there's never an
   ambiguous "which script's new-card budget wins today" question. */
function buildSession(unlimited, scriptMode){
  rolloverDay();
  const directions = directionsForMode();
  const scripts = scriptsForMode(scriptMode);

  const activeByScript = {};
  scripts.forEach(scriptId=>{
    activeByScript[scriptId] = activeKanaList(scriptId);
    activeByScript[scriptId].forEach(item => directions.forEach(dir => ensureCard(item, dir)));
  });

  const now = Date.now();
  const dueReview = [];
  const dueLearning = [];
  const freshNew = [];

  Object.values(state.cards).forEach(c=>{
    if(!scripts.includes(c.script)) return;
    if(!activeByScript[c.script].find(a=>a.kana===c.kana)) return;
    if(!directions.includes(c.direction)) return;
    if(c.phase === 'review' && c.dueDate <= now) dueReview.push(c);
    else if(c.phase === 'learning' || c.phase === 'relearning') dueLearning.push(c);
    else if(c.phase === 'new') freshNew.push(c);
  });

  shuffle(dueReview);
  shuffle(freshNew);
  const effectiveReviewCap = scriptMode === 'mixed'
    ? Math.max(...ENABLED_SCRIPTS.map(s=>state.settings.reviewCap[s]))
    : state.settings.reviewCap[scriptMode];
  const reviewSlice = unlimited ? dueReview : dueReview.slice(0, effectiveReviewCap);

  let newSlice = [];
  const naturalSliceByScript = {};
  if(scriptMode !== 'mixed'){
    /* Manually force-unlocked rows bypass the daily new-card pacing cap
       entirely for their own script — forcing a row open is already an
       explicit request to study it now. */
    const forcedNew = freshNew.filter(c=>isForceUnlocked(c.script, c.rowId));
    const naturalNew = freshNew.filter(c=>!isForceUnlocked(c.script, c.rowId));
    const newBudget = unlimited ? naturalNew.length : Math.max(0, state.settings.newPerDay[scriptMode] - state.newIntroducedToday[scriptMode]);
    const naturalSlice = naturalNew.slice(0, newBudget);
    newSlice = forcedNew.concat(naturalSlice);
    naturalSliceByScript[scriptMode] = naturalSlice;
  }

  const queue = [];
  dueLearning.forEach(c=>queue.push(c));
  reviewSlice.forEach(c=>queue.push(c));
  newSlice.forEach(c=>queue.push(c));
  shuffle(queue);

  return { queue, pos:0, correctCount:0, total:queue.length, naturalSliceByScript };
}

function startSession(unlimited, scriptMode){
  session = buildSession(unlimited, scriptMode);
  Object.entries(session.naturalSliceByScript).forEach(([scriptId, list])=>{
    state.newIntroducedToday[scriptId] += list.length;
  });
  persistState();
  setRoute('study');
}

/* Free study: practice any already-introduced character any time, ignoring
   due dates and daily caps entirely. Reviews here still update each card's
   normal scheduling data (same as answering a due card) — an early correct
   answer is still real evidence of recall strength, it just isn't gated by
   the calendar. New (never-seen) characters are excluded here UNLESS their
   row was manually force-unlocked. rowId filtering only makes sense within
   a single script (row ids like 'k'/'s' collide across scripts), so it's
   ignored in mixed mode — mixed free study is "everything studied so far". */
function buildFreeStudySession(scriptMode, rowId){
  rolloverDay();
  const directions = directionsForMode();
  const scripts = scriptsForMode(scriptMode);

  const activeByScript = {};
  scripts.forEach(scriptId=>{
    activeByScript[scriptId] = activeKanaList(scriptId);
    activeByScript[scriptId].forEach(item => directions.forEach(dir => ensureCard(item, dir)));
  });

  const pool = Object.values(state.cards).filter(c=>{
    if(!scripts.includes(c.script)) return false;
    if(c.phase === 'new' && !isForceUnlocked(c.script, c.rowId)) return false;
    if(!activeByScript[c.script].find(a=>a.kana===c.kana)) return false;
    if(!directions.includes(c.direction)) return false;
    if(scriptMode !== 'mixed' && rowId && rowId !== 'all' && c.rowId !== rowId) return false;
    return true;
  });
  shuffle(pool);
  return { queue:pool, pos:0, correctCount:0, total:pool.length, naturalSliceByScript:{} };
}

function startFreeStudy(scriptMode, rowId){
  session = buildFreeStudySession(scriptMode, rowId);
  setRoute('study');
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

function dueCount(scriptMode){
  rolloverDay();
  const directions = directionsForMode();
  const now = Date.now();
  const scripts = scriptsForMode(scriptMode);

  let n = 0;
  let forcedFreshTotal = 0;
  let naturalFreshTotal = 0;

  scripts.forEach(scriptId=>{
    const active = activeKanaList(scriptId);
    active.forEach(item => directions.forEach(dir => ensureCard(item, dir)));

    Object.values(state.cards).forEach(c=>{
      if(c.script !== scriptId) return;
      if(!active.find(a=>a.kana===c.kana)) return;
      if(!directions.includes(c.direction)) return;
      if(c.phase==='review' && c.dueDate<=now) n++;
      else if(c.phase==='learning' || c.phase==='relearning') n++;
    });

    if(scriptMode !== 'mixed'){
      const freshCards = Object.values(state.cards).filter(c=>{
        if(c.script !== scriptId) return false;
        if(!active.find(a=>a.kana===c.kana)) return false;
        if(!directions.includes(c.direction)) return false;
        return c.phase==='new';
      });
      const forced = freshCards.filter(c=>isForceUnlocked(c.script, c.rowId)).length;
      forcedFreshTotal += forced;
      naturalFreshTotal += (freshCards.length - forced);
    }
  });

  if(scriptMode === 'mixed') return n; // mixed never counts new cards — review-only by design

  const newBudget = Math.max(0, state.settings.newPerDay[scriptMode] - state.newIntroducedToday[scriptMode]);
  return n + forcedFreshTotal + Math.min(newBudget, naturalFreshTotal);
}

/* When nothing is due right now, figure out WHEN the next thing becomes
   available, so the Study tab can show a live countdown instead of a
   flat "check back later." Two possible sources: the earliest not-yet-due
   review card, or (single-script modes only) the next daily-budget reset
   if there are still fresh characters waiting behind today's cap. Mixed
   mode never introduces new cards, so only review dates apply there.
   Returns a timestamp (ms), or null if there's genuinely nothing left
   scheduled or waiting (e.g. everything currently unlocked is mastered). */
function nextUtcMidnight(){
  const now = new Date();
  return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()+1, 0, 0, 0, 0);
}

function nextAvailableAt(scriptMode){
  const directions = directionsForMode();
  const scripts = scriptsForMode(scriptMode);
  let earliest = null;

  scripts.forEach(scriptId=>{
    const active = activeKanaList(scriptId);
    active.forEach(item => directions.forEach(dir => ensureCard(item, dir))); // self-sufficient — don't rely on dueCount() having run first
    Object.values(state.cards).forEach(c=>{
      if(c.script !== scriptId) return;
      if(!active.find(a=>a.kana===c.kana)) return;
      if(!directions.includes(c.direction)) return;
      if(c.phase === 'review' && c.dueDate > Date.now()){
        if(earliest === null || c.dueDate < earliest) earliest = c.dueDate;
      }
    });
  });

  if(scriptMode !== 'mixed'){
    const active = activeKanaList(scriptMode);
    const naturalFreshCount = Object.values(state.cards).filter(c=>{
      if(c.script !== scriptMode) return false;
      if(!active.find(a=>a.kana===c.kana)) return false;
      if(!directions.includes(c.direction)) return false;
      return c.phase === 'new' && !isForceUnlocked(c.script, c.rowId);
    }).length;
    const budgetUsedUp = state.newIntroducedToday[scriptMode] >= state.settings.newPerDay[scriptMode];
    if(naturalFreshCount > 0 && budgetUsedUp){
      const midnight = nextUtcMidnight();
      if(earliest === null || midnight < earliest) earliest = midnight;
    }
  }

  return earliest;
}

function formatDuration(ms){
  if(ms <= 0) return 'any moment now';
  if(ms < 60000) return 'less than a minute';
  const totalMinutes = Math.ceil(ms / 60000);
  if(totalMinutes < 60) return totalMinutes + ' minute' + (totalMinutes===1?'':'s');
  const totalHours = Math.floor(totalMinutes / 60);
  const remMinutes = totalMinutes % 60;
  if(totalHours < 24){
    return totalHours + 'h' + (remMinutes>0 ? ' ' + remMinutes + 'm' : '');
  }
  const days = Math.floor(totalHours / 24);
  const remHours = totalHours % 24;
  return days + ' day' + (days===1?'':'s') + (remHours>0 ? ' ' + remHours + 'h' : '');
}

/* ============================= RENDERING ============================= */
const $main = document.getElementById('main');
let route = 'home';

function setRoute(r){
  route = r;
  document.querySelectorAll('.menu-panel button[data-route]').forEach(b=>{
    const isActive = b.dataset.route === r || (b.dataset.route==='home' && r==='study') || (b.dataset.route==='settings' && r==='stats');
    b.classList.toggle('active', isActive);
  });
  closeMenu();
  render();
}

const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');
function openMenu(){ closeModePanel(); menuPanel.hidden = false; menuBtn.setAttribute('aria-expanded','true'); }
function closeMenu(){ menuPanel.hidden = true; menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.onclick = (e)=>{ e.stopPropagation(); menuPanel.hidden ? openMenu() : closeMenu(); };
document.querySelectorAll('.menu-panel button[data-route]').forEach(b=>{
  b.onclick = ()=> setRoute(b.dataset.route);
});
document.addEventListener('click', (e)=>{
  if(!menuPanel.hidden && !menuPanel.contains(e.target) && e.target !== menuBtn) closeMenu();
});

/* ---------- Header mode switcher ---------- */
const modePillBtn = document.getElementById('modePillBtn');
const modePanel = document.getElementById('modePanel');
function openModePanel(){ closeMenu(); modePanel.hidden = false; modePillBtn.setAttribute('aria-expanded','true'); }
function closeModePanel(){ modePanel.hidden = true; modePillBtn.setAttribute('aria-expanded','false'); }
modePillBtn.onclick = (e)=>{ e.stopPropagation(); modePanel.hidden ? openModePanel() : closeModePanel(); };
document.addEventListener('click', (e)=>{
  if(!modePanel.hidden && !modePanel.contains(e.target) && e.target !== modePillBtn) closeModePanel();
});
function modeLabel(scriptMode){
  if(scriptMode === 'mixed') return 'Mixed';
  return SCRIPT_DEFS[scriptMode] ? SCRIPT_DEFS[scriptMode].label : scriptMode;
}
function updateModePill(){
  const lbl = document.getElementById('modePillLabel');
  if(lbl) lbl.textContent = modeLabel(state.settings.studyScript);
  document.querySelectorAll('#modePanel [data-script]').forEach(b=>{
    b.classList.toggle('active', b.dataset.script === state.settings.studyScript);
  });
}
document.querySelectorAll('#modePanel [data-script]').forEach(b=>{
  b.onclick = ()=>{
    state.settings.studyScript = b.dataset.script;
    persistState();
    updateModePill();
    closeModePanel();
    if(route === 'home') renderHome();
  };
});

let homeCountdownTimer = null;
function render(){
  if(homeCountdownTimer){ clearInterval(homeCountdownTimer); homeCountdownTimer = null; }
  if(route==='home') renderHome();
  else if(route==='study') renderCard();
  else if(route==='stats') renderStats();
  else if(route==='settings') renderSettings();
  else if(route==='reference') renderReference();
  else if(route==='end') renderSessionEnd();
}

/* ---------- Study tab ---------- */
function rowProgressHtml(scriptId){
  const def = SCRIPT_DEFS[scriptId];
  const unlocked = unlockedRowIndexes(scriptId);
  const activeRows = def.rows.filter(isRowEnabled);
  const directions = directionsForMode();
  const items = kanaListForScript(scriptId);

  return activeRows.map(row=>{
    const isUnlocked = unlocked.has(row.id);
    const rowItems = items.filter(k=>k.rowId===row.id);
    let done = 0, denom = rowItems.length*directions.length;
    rowItems.forEach(item=> directions.forEach(dir=>{
      const c = state.cards[cardKey(item.kana,dir)];
      if(c && c.phase==='review') done++;
    }));
    const pct = denom ? Math.round(100*done/denom) : 0;
    return `<div class="row-line">
      <span class="rk ${row.optional?'label':''} ${isUnlocked?'':'locked'}">${row.optional ? row.label : row.items.map(i=>i[0]).join('')}</span>
      <div class="bar"><div class="fill" style="width:${isUnlocked?pct:0}%"></div></div>
      <span class="pct">${isUnlocked? pct+'%' : '🔒'}</span>
    </div>`;
  }).join('');
}

function renderHome(){
  rolloverDay();
  const scriptMode = state.settings.studyScript;
  const due = dueCount(scriptMode);

  const graduated = Object.values(state.cards).filter(c=>c.phase==='review' && (scriptMode==='mixed' || c.script===scriptMode)).length;
  const total = Object.values(state.cards).filter(c=> scriptMode==='mixed' || c.script===scriptMode).length;

  let rowProgressSection;
  let freeStudyOptions;
  const introducedCount = Object.values(state.cards).filter(c=> c.phase!=='new' && (scriptMode==='mixed' || c.script===scriptMode)).length;

  if(scriptMode === 'mixed'){
    rowProgressSection = ENABLED_SCRIPTS.map(scriptId=>`
      <div class="row-progress">
        <h3>${SCRIPT_DEFS[scriptId].label} rows</h3>
        ${rowProgressHtml(scriptId)}
      </div>`).join('');
    freeStudyOptions = [{id:'all', label:'All studied characters (both scripts)'}];
  } else {
    rowProgressSection = `<div class="row-progress"><h3>Row progress</h3>${rowProgressHtml(scriptMode)}</div>`;
    const def = SCRIPT_DEFS[scriptMode];
    const unlocked = unlockedRowIndexes(scriptMode);
    const activeRows = def.rows.filter(isRowEnabled);
    const unlockedRowsForSelect = activeRows.filter(r=>unlocked.has(r.id));
    freeStudyOptions = [{id:'all', label:'All studied characters'}].concat(
      unlockedRowsForSelect.map(r=>({ id:r.id, label:r.optional ? r.label : r.items.map(i=>i[0]).join('') }))
    );
  }

  const startLabel = due===0
    ? 'Nothing due right now'
    : (scriptMode === 'mixed' ? 'Start mixed review ('+due+' cards)' : 'Start session ('+due+' cards)');

  let waitBlockHtml = '';
  if(due === 0){
    const nextAt = nextAvailableAt(scriptMode);
    if(nextAt === null){
      waitBlockHtml = `<p class="help">You're fully caught up on everything currently unlocked. Unlock more rows in Settings, or use Free study below, to keep going.</p>`;
    } else {
      waitBlockHtml = `<p class="help" id="nextAvailableCountdown">Next character available in ${formatDuration(nextAt - Date.now())}</p>`;
    }
  }

  $main.innerHTML = `
    <div class="summary-row">
      <div class="stat-block"><div class="num">${due}</div><div class="lab">cards due now</div></div>
      <div class="stat-block"><div class="num">${graduated}/${total||0}</div><div class="lab">graduated to review</div></div>
    </div>
    <button class="start-btn" id="startBtn" ${due===0?'disabled':''}>${startLabel}</button>
    ${waitBlockHtml}
    ${scriptMode==='mixed' ? `<p class="help">Mixed mode reviews whatever's already unlocked in both scripts — it never introduces new characters. Switch to Hiragana or Katakana mode to learn new ones.</p>` : ''}
    ${introducedCount > 0 ? `
    <div class="free-study-wrap">
      <button class="muted-btn" id="freeStudyToggle">Free study</button>
      <div class="sub-menu" id="freeStudyMenu" hidden>
        ${freeStudyOptions.map(o=>`<button data-scope="${o.id}">${o.label}</button>`).join('')}
      </div>
    </div>` : ''}
    ${rowProgressSection}
  `;

  const btn = document.getElementById('startBtn');
  if(btn) btn.onclick = ()=> startSession(false, scriptMode);

  if(due === 0){
    const nextAt = nextAvailableAt(scriptMode);
    if(nextAt !== null){
      const countdownEl = document.getElementById('nextAvailableCountdown');
      const tick = ()=>{
        const remaining = nextAt - Date.now();
        if(remaining <= 0){
          renderHome(); // time's up — refresh so the newly-due card actually shows
          return;
        }
        if(countdownEl) countdownEl.textContent = 'Next character available in ' + formatDuration(remaining);
      };
      homeCountdownTimer = setInterval(tick, 30000);
    }
  }

  const freeToggle = document.getElementById('freeStudyToggle');
  const freeMenu = document.getElementById('freeStudyMenu');
  if(freeToggle){
    freeToggle.onclick = (e)=>{ e.stopPropagation(); freeMenu.hidden = !freeMenu.hidden; };
    freeMenu.querySelectorAll('[data-scope]').forEach(b=>{
      b.onclick = ()=> startFreeStudy(scriptMode, b.dataset.scope);
    });
    document.addEventListener('click', (e)=>{
      if(!freeMenu.hidden && !freeMenu.contains(e.target) && e.target !== freeToggle) freeMenu.hidden = true;
    });
  }
}

function renderCard(){
  if(!session || session.pos >= session.queue.length){
    setRoute('end');
    return;
  }
  const card = session.queue[session.pos];
  const pct = Math.round(100*session.pos/session.total);

  let body = '';
  const drawMode = (card.direction === 'recognition' && state.settings.kanaInputMode[card.script] === 'draw');
  const homophones = (card.direction === 'recognition') ? homophonesOf(card.kana) : [];
  const homophoneNote = homophones.length
    ? `<p class="help" style="margin-top:2px;">${homophones.join(' / ')} ${homophones.length>1?'are':'is'} also read "${card.romaji}" — either is correct here.</p>`
    : '';

  if(card.direction === 'production'){
    body = `
      <div class="prompt-label">${card.meaning ? 'Type the reading or the meaning' : 'Type the reading'}</div>
      <div class="prompt-kana jp">${card.kana}</div>
      <div class="answer-area">
        <input type="text" id="romajiInput" class="romaji-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" placeholder="${card.meaning ? 'reading or meaning…' : 'type romaji…'}">
        <div class="submit-row"><button class="submit-btn" id="submitBtn">Check</button></div>
      </div>
      <div class="feedback" id="feedback"></div>
    `;
  } else if(drawMode){
    body = `
      <div class="prompt-label">Draw the matching kana from memory</div>
      <div class="prompt-romaji">${card.romaji}</div>
      ${homophoneNote}
      <div class="draw-wrap">
        <canvas id="drawCanvas" class="draw-canvas" width="220" height="220"></canvas>
        <div class="draw-tools">
          <button id="clearBtn" type="button">Clear</button>
          <button id="revealBtn" type="button">Reveal answer</button>
        </div>
        <div id="revealZone"></div>
      </div>
      <div class="feedback" id="feedback"></div>
    `;
  } else {
    const pool = gridPool(card);
    const options = pool.slice();
    shuffle(options);
    body = `
      <div class="prompt-label">Select the matching kana</div>
      <div class="prompt-romaji">${card.romaji}</div>
      ${homophoneNote}
      <div class="answer-area">
        <div class="grid" id="grid">
          ${options.map(o=>`<button data-kana="${o.kana}" data-romaji="${o.romaji}">${o.kana}</button>`).join('')}
        </div>
      </div>
      <div class="feedback" id="feedback"></div>
    `;
  }

  $main.innerHTML = `
    <div class="session-bar">
      <span>${session.pos+1} / ${session.total}</span>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <span>${session.correctCount} correct</span>
    </div>
    <div class="card"><div class="card-inner">${body}</div></div>
  `;

  const startTime = Date.now();
  let answered = false;

  function finish(correct, homophoneChosen){
    if(answered) return;
    answered = true;
    const latency = Date.now() - startTime;
    const result = graded(card, correct, latency);
    persistState();
    session.pos++;
    if(correct) session.correctCount++;

    const fb = document.getElementById('feedback');
    if(fb){
      fb.className = 'feedback ' + (correct?'good':'bad');
      if(homophoneChosen){
        fb.textContent = 'Correct — ' + homophoneChosen + ' is also read "' + card.romaji + '"';
      } else {
        fb.textContent = correct
          ? (card.phase==='review' ? 'Correct — next review in ' + card.interval + ' day' + (card.interval===1?'':'s') : 'Correct')
          : 'Not quite — ' + card.kana + ' is "' + card.romaji + '"' + (card.meaning ? ' (' + card.meaning + ')' : '');
      }
    }
    if(result.requeue){
      const insertAt = Math.min(session.queue.length, session.pos + result.lag);
      session.queue.splice(insertAt, 0, card);
      session.total = session.queue.length;
    }
    document.querySelectorAll('.grid button, #submitBtn, #romajiInput, #clearBtn, #revealBtn, #selfYes, #selfNo').forEach(el=> el.disabled = true);
    if(drawMode){
      setTimeout(renderCard, 500);
    } else {
      const cont = document.createElement('button');
      cont.className = 'next-btn';
      cont.textContent = 'Continue';
      cont.onclick = renderCard;
      document.querySelector('.card-inner').appendChild(cont);
      cont.focus();
    }
  }

  if(card.direction === 'production'){
    const input = document.getElementById('romajiInput');
    const submitBtn = document.getElementById('submitBtn');
    input.focus();
    input.addEventListener('focus', ()=>{
      setTimeout(()=> input.scrollIntoView({ block:'center', behavior:'smooth' }), 250);
    });
    function submit(){
      const val = input.value.trim().toLowerCase();
      if(!val) return;
      const accepted = altSpellings(card.romaji, card.kana);
      const meaningMatch = acceptedMeanings(card.meaning).includes(val);
      finish(accepted.includes(val) || meaningMatch);
    }
    submitBtn.onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  } else if(drawMode){
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#26241F';

    function drawGuides(){
      const guideColor = getComputedStyle(document.documentElement).getPropertyValue('--paper-line').trim() || '#888';
      ctx.save();
      ctx.strokeStyle = guideColor;
      ctx.lineWidth = 1;
      ctx.setLineDash([4,5]);
      ctx.beginPath();
      ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
      ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2);
      ctx.stroke();
      ctx.restore();
    }
    drawGuides();

    let drawing = false, lastX=0, lastY=0;

    function pos(e){
      const r = canvas.getBoundingClientRect();
      const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      return [cx*scaleX, cy*scaleY];
    }
    function start(e){ e.preventDefault(); drawing = true; [lastX,lastY] = pos(e); }
    function move(e){
      if(!drawing) return;
      e.preventDefault();
      const [x,y] = pos(e);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
      [lastX,lastY] = [x,y];
    }
    function end(){ drawing = false; }
    ['mousedown','touchstart'].forEach(ev=> canvas.addEventListener(ev, start));
    ['mousemove','touchmove'].forEach(ev=> canvas.addEventListener(ev, move));
    ['mouseup','mouseleave','touchend'].forEach(ev=> canvas.addEventListener(ev, end));

    document.getElementById('clearBtn').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); drawGuides(); };

    document.getElementById('revealBtn').onclick = ()=>{
      document.getElementById('revealBtn').disabled = true;
      document.getElementById('clearBtn').disabled = true;
      document.getElementById('revealZone').innerHTML = `
        <div class="reveal-compare">
          <div class="answer-kana jp">${card.kana}</div>
        </div>
        <div class="self-grade">
          <button class="no" id="selfNo">I was wrong</button>
          <button class="yes" id="selfYes">I had it right</button>
        </div>
      `;
      document.getElementById('selfYes').onclick = ()=> finish(true);
      document.getElementById('selfNo').onclick = ()=> finish(false);
    };
  } else {
    document.querySelectorAll('#grid button').forEach(btn=>{
      btn.onclick = ()=>{
        if(answered) return;
        const chosen = btn.dataset.kana;
        const isExactMatch = chosen === card.kana;
        const isHomophoneMatch = card.script !== 'kanji' && btn.dataset.romaji === card.romaji;
        const correct = isExactMatch || isHomophoneMatch;
        if(correct){
          btn.classList.add('correct');
        } else {
          btn.classList.add('incorrect');
          document.querySelectorAll('#grid button').forEach(b=>{
            if(b.dataset.kana === card.kana) b.classList.add('reveal');
          });
        }
        finish(correct, isHomophoneMatch && !isExactMatch ? chosen : null);
      };
    });
  }
}

function renderSessionEnd(){
  const pct = session.total ? Math.round(100*session.correctCount/session.total) : 0;
  const scriptMode = state.settings.studyScript;
  const moreDue = dueCount(scriptMode);
  $main.innerHTML = `
    <div class="session-end">
      <div class="num">${pct}%</div>
      <p>${session.correctCount} of ${session.total} correct this session.</p>
      ${moreDue > 0 ? `<button class="start-btn" id="continueBtn" style="max-width:260px;margin:20px auto 0;">Keep studying (${moreDue} more due)</button>` : ''}
      <button class="start-btn" id="doneBtn" style="max-width:260px;margin:${moreDue>0?'12px':'20px'} auto 0;background:transparent;color:var(--ink);border:1px solid var(--paper-line);">Back to overview</button>
    </div>
  `;
  const continueBtn = document.getElementById('continueBtn');
  if(continueBtn) continueBtn.onclick = ()=> startSession(true, scriptMode);
  document.getElementById('doneBtn').onclick = ()=>{ session=null; setRoute('home'); };
}

/* ---------- Answer key ---------- */
function renderReference(){
  const current = (state.settings.studyScript === 'mixed' || !SCRIPT_DEFS[state.settings.studyScript] || !SCRIPT_DEFS[state.settings.studyScript].enabled)
    ? 'hiragana' : state.settings.studyScript;
  renderReferenceFor(current);
}

function renderReferenceFor(scriptId){
  const isKanji = scriptId === 'kanji';
  const def = SCRIPT_DEFS[scriptId];
  const rows = def.rows.filter(isRowEnabled);
  const sections = rows.map(row=>{
    const cells = row.items.map(([kana, romaji, meaning])=>
      `<button class="ref-cell" data-kana="${kana}"><div class="k jp">${kana}</div><div class="r">${isKanji ? meaning : romaji}</div></button>`
    ).join('');
    return `<div class="ref-section">
      <h3>${row.label}</h3>
      <div class="ref-grid">${cells}</div>
    </div>`;
  }).join('');

  const tabsHtml = ENABLED_SCRIPTS.map(id=>
    `<button data-refscript="${id}" class="${id===scriptId?'active':''}">${SCRIPT_DEFS[id].label}</button>`
  ).join('');

  const helpText = isKanji
    ? 'Meaning shown by default — tap a character to see its reading.'
    : 'Tap a character to see every spelling accepted when typing.';

  $main.innerHTML = `
    <div class="choice-row" style="margin-bottom:16px;">${tabsHtml}</div>
    <div class="ref-detail" id="refDetail">
      <p class="help" style="margin:0;">${helpText}</p>
    </div>
    ${sections}
  `;

  document.querySelectorAll('[data-refscript]').forEach(b=>{
    b.onclick = ()=> renderReferenceFor(b.dataset.refscript);
  });

  document.querySelectorAll('.ref-cell').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('.ref-cell.active').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const kana = btn.dataset.kana;
      const item = ALL_KANA_LIST.find(k=>k.kana===kana);
      const accepted = altSpellings(item.romaji, kana);
      const alternates = accepted.filter(a=>a!==item.romaji);
      const detail = document.getElementById('refDetail');
      detail.innerHTML = `
        <div class="ref-detail-kana jp">${kana}</div>
        <div class="ref-detail-body">
          <div class="ref-detail-primary">${item.romaji}${alternates.length ? ' <span class="ref-detail-alts">(' + alternates.join(', ') + ')</span>' : ''}</div>
          ${isKanji ? `<div class="ref-detail-alts">${item.meaning}</div>` : ''}
        </div>
      `;
    };
  });
}

/* ---------- Stats ---------- */
function renderStats(){
  const rows = Object.values(state.cards)
    .filter(c=>c.phase!=='new')
    .sort((a,b)=> (a.script||'').localeCompare(b.script||'') || a.rowIndex-b.rowIndex || (a.dueDate||0)-(b.dueDate||0));

  const trs = rows.map(c=>{
    const acc = c.reviewsCount ? Math.round(100*c.correctCount/c.reviewsCount) : 0;
    const tagClass = c.phase==='review' ? 'rev' : 'lrn';
    const due = c.phase==='review' ? new Date(c.dueDate).toLocaleDateString() : '—';
    const scriptLabel = SCRIPT_DEFS[c.script] ? SCRIPT_DEFS[c.script].label : c.script;
    return `<tr>
      <td class="kn">${c.kana}</td>
      <td>${c.romaji}</td>
      <td>${scriptLabel}</td>
      <td>${c.direction==='production'?'type':'select'}</td>
      <td><span class="tag ${tagClass}">${c.phase}</span></td>
      <td>${acc}%</td>
      <td>${due}</td>
    </tr>`;
  }).join('');

  const totalAcc = state.totals.reviews ? Math.round(100*state.totals.correct/state.totals.reviews) : 0;

  $main.innerHTML = `
    <button class="muted-btn" id="backToSettings" style="margin-bottom:16px;">← Settings</button>
    <div class="summary-row">
      <div class="stat-block"><div class="num">${state.totals.reviews}</div><div class="lab">total reviews</div></div>
      <div class="stat-block"><div class="num">${totalAcc}%</div><div class="lab">overall accuracy</div></div>
    </div>
    <table>
      <thead><tr><th>Kana</th><th>Romaji</th><th>Script</th><th>Mode</th><th>Status</th><th>Accuracy</th><th>Next due</th></tr></thead>
      <tbody>${trs || '<tr><td colspan="7" style="color:var(--ink-soft);padding-top:14px;">No cards studied yet — start a session from the Study tab.</td></tr>'}</tbody>
    </table>
  `;
  document.getElementById('backToSettings').onclick = ()=> setRoute('settings');
}

/* ---------- Settings ---------- */
function scriptSettingsSectionHtml(scriptId){
  const s = state.settings;
  const def = SCRIPT_DEFS[scriptId];
  const youonKey = scriptId === 'hiragana' ? 'includeYouonHiragana' : 'includeYouonKatakana';
  const toggleField = scriptId === 'kanji'
    ? `<div class="field">
        <label>Travel &amp; Signage words (危険, 禁止, etc. — mostly N4, but common on real signs)</label>
        <div class="choice-row">
          <button data-travel="off" class="${!s.includeTravelKanji?'active':''}">Off</button>
          <button data-travel="on" class="${s.includeTravelKanji?'active':''}">Include, after base rows</button>
        </div>
      </div>`
    : `<div class="field">
        <label>Youon combinations (きゃ, しゅ, etc.)</label>
        <div class="choice-row">
          <button data-yo="off" data-yo-script="${scriptId}" class="${!s[youonKey]?'active':''}">Off</button>
          <button data-yo="on" data-yo-script="${scriptId}" class="${s[youonKey]?'active':''}">Include, after base rows</button>
        </div>
      </div>`;
  const methodLabel = scriptId === 'kanji' ? 'Romaji → kanji answer method' : 'Romaji → kana answer method';
  return `
    <h3 class="settings-section">${def.label}</h3>
    <div class="field">
      <label>New characters introduced per day</label>
      <input type="number" class="script-setting" data-field="newPerDay" data-script="${scriptId}" min="1" max="20" value="${s.newPerDay[scriptId]}">
    </div>
    <div class="field">
      <label>Maximum review cards per session</label>
      <input type="number" class="script-setting" data-field="reviewCap" data-script="${scriptId}" min="5" max="200" value="${s.reviewCap[scriptId]}">
    </div>
    <div class="field">
      <label>${methodLabel}</label>
      <div class="choice-row">
        <button data-ki="draw" data-ki-script="${scriptId}" class="${s.kanaInputMode[scriptId]==='draw'?'active':''}">Draw from memory (self-graded)</button>
        <button data-ki="select" data-ki-script="${scriptId}" class="${s.kanaInputMode[scriptId]==='select'?'active':''}">Tap from grid</button>
      </div>
    </div>
    ${toggleField}
    <div class="field">
      <label>Unlock rows manually</label>
      <div class="choice-row" id="unlockRow-${scriptId}"></div>
    </div>
  `;
}

function renderSettings(){
  persistState();
  const s = state.settings;
  $main.innerHTML = `
    <h3 class="settings-section" style="margin-top:0;">General</h3>
    <div class="field">
      <label>Review stats</label>
      <button class="muted-btn" id="statsBtn">View stats</button>
    </div>
    ${deferredInstallPrompt ? `
    <div class="field">
      <label>Install</label>
      <button class="start-btn" id="installBtn" style="max-width:260px;">Install Kana Trainer</button>
    </div>` : ''}
    <div class="field">
      <label>Appearance</label>
      <div class="choice-row">
        <button data-th="dark" class="${s.theme!=='light'?'active':''}">Dark</button>
        <button data-th="light" class="${s.theme==='light'?'active':''}">Light</button>
      </div>
    </div>
    <div class="field">
      <label>Card direction (applies to every script)</label>
      <div class="choice-row">
        <button data-v="both" class="${s.directionMode==='both'?'active':''}">Both</button>
        <button data-v="recognition" class="${s.directionMode==='recognition'?'active':''}">Romaji → character only</button>
        <button data-v="production" class="${s.directionMode==='production'?'active':''}">Character → romaji only</button>
      </div>
    </div>
    <div class="field">
      <label>Tap-grid pool (applies to every script)</label>
      <div class="choice-row">
        <button data-gs="unlocked" class="${s.gridScope!=='all'?'active':''}">Unlocked characters only</button>
        <button data-gs="all" class="${s.gridScope==='all'?'active':''}">All characters in that script</button>
      </div>
    </div>

    ${scriptSettingsSectionHtml('hiragana')}
    ${scriptSettingsSectionHtml('katakana')}
    ${scriptSettingsSectionHtml('kanji')}

    <div class="field">
      <button class="muted-btn" id="resetOverridesBtn">Reset all rows to automatic (all scripts)</button>
    </div>
    <div class="field">
      <label>Progress file</label>
      <div class="io-row">
        <button class="primary" id="exportBtn">Export progress (.json)</button>
        <button id="importBtn">Import progress</button>
        <button id="resetBtn" style="border-color:var(--hanko);color:var(--hanko);">Reset all progress</button>
      </div>
      <p class="help" id="ioMsg" style="min-height:18px;"></p>
    </div>
  `;

  function wireUnlockList(scriptId){
    const def = SCRIPT_DEFS[scriptId];
    const unlocked = unlockedRowIndexes(scriptId);
    const activeRows = def.rows.filter(isRowEnabled);
    const el = document.getElementById('unlockRow-' + scriptId);
    activeRows.forEach(row=>{
      const isUnlocked = unlocked.has(row.id);
      const btn = document.createElement('button');
      btn.textContent = (row.optional ? row.label : row.items.map(i=>i[0]).join('')) + (isUnlocked ? ' ✓' : ' 🔒');
      if(isUnlocked) btn.className = 'active';
      btn.onclick = ()=>{
        if(!state.rowOverrides[scriptId]) state.rowOverrides[scriptId] = {};
        if(isUnlocked){
          state.rowOverrides[scriptId][row.id] = 'lock';
        } else if(naturallyUnlockedRowIds(scriptId).has(row.id)){
          delete state.rowOverrides[scriptId][row.id];
        } else {
          state.rowOverrides[scriptId][row.id] = 'unlock';
        }
        renderSettings();
      };
      el.appendChild(btn);
    });
  }
  ENABLED_SCRIPTS.forEach(wireUnlockList);

  document.getElementById('resetOverridesBtn').onclick = ()=>{
    state.rowOverrides = { hiragana:{}, katakana:{}, kanji:{} };
    renderSettings();
  };

  document.querySelectorAll('.script-setting[data-field="newPerDay"]').forEach(inp=>{
    inp.onchange = e=>{
      s.newPerDay[inp.dataset.script] = Math.max(1, parseInt(e.target.value)||1);
      persistState();
    };
  });
  document.querySelectorAll('.script-setting[data-field="reviewCap"]').forEach(inp=>{
    inp.onchange = e=>{
      s.reviewCap[inp.dataset.script] = Math.max(5, parseInt(e.target.value)||5);
      persistState();
    };
  });
  document.querySelectorAll('[data-v]').forEach(b=> b.onclick = ()=>{ s.directionMode = b.dataset.v; renderSettings(); });
  document.querySelectorAll('[data-yo]').forEach(b=> b.onclick = ()=>{
    const key = b.dataset.yoScript === 'hiragana' ? 'includeYouonHiragana' : 'includeYouonKatakana';
    s[key] = (b.dataset.yo==='on');
    renderSettings();
  });
  document.querySelectorAll('[data-travel]').forEach(b=> b.onclick = ()=>{ s.includeTravelKanji = (b.dataset.travel==='on'); renderSettings(); });
  document.querySelectorAll('[data-ki]').forEach(b=> b.onclick = ()=>{ s.kanaInputMode[b.dataset.kiScript] = b.dataset.ki; renderSettings(); });
  document.querySelectorAll('[data-gs]').forEach(b=> b.onclick = ()=>{ s.gridScope = b.dataset.gs; renderSettings(); });
  document.querySelectorAll('[data-th]').forEach(b=> b.onclick = ()=>{ s.theme = b.dataset.th; applyTheme(); renderSettings(); });
  const installBtn = document.getElementById('installBtn');
  if(installBtn) installBtn.onclick = async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    renderSettings();
  };
  document.getElementById('statsBtn').onclick = ()=> setRoute('stats');

  document.getElementById('exportBtn').onclick = exportProgress;
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();

  let pendingReset = false;
  let pendingResetTimer = null;
  document.getElementById('resetBtn').onclick = ()=>{
    const rBtn = document.getElementById('resetBtn');
    if(!pendingReset){
      pendingReset = true;
      rBtn.textContent = 'Tap again to confirm';
      pendingResetTimer = setTimeout(()=>{
        pendingReset = false;
        rBtn.textContent = 'Reset all progress';
      }, 4000);
      return;
    }
    clearTimeout(pendingResetTimer);
    pendingReset = false;
    state = freshState();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(err){}
    applyTheme();
    updateModePill();
    renderSettings();
  };
}

function exportProgress(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kana-trainer-progress-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const msg = document.getElementById('ioMsg');
    try{
      const parsed = JSON.parse(reader.result);
      if(parsed && parsed.cards && parsed.settings){
        state = migrateState(parsed);
        rolloverDay();
        applyTheme();
        updateModePill();
        renderSettings();
        const m = document.getElementById('ioMsg');
        if(m) m.textContent = 'Progress imported.';
      } else if(msg){
        msg.textContent = 'That file does not look like a Kana Trainer progress export.';
      }
    }catch(err){
      if(msg) msg.textContent = 'Could not read that file: ' + err.message;
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================= INIT ============================= */
const restored = loadPersistedState();
if(restored) state = restored;
rolloverDay();
applyTheme();
updateModePill();
setRoute('home');

if('virtualKeyboard' in navigator){
  try{ navigator.virtualKeyboard.overlaysContent = false; }catch(err){}
}

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(route === 'settings') renderSettings();
});

})();

</script>
